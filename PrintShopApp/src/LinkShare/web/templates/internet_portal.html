<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1565c0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Internet Access Request">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>인터넷 사용 신청</title>
    <style>
        * { forced-color-adjust: none !important; }
        :root { color-scheme: light; }
        body { 
            margin: 0; 
            padding: 20px; 
            background: #f3f6f8 !important; 
            color: #263238 !important; 
            font-family: Arial, sans-serif; 
        }
        main { 
            max-width: 520px; 
            margin: auto; 
            background: white !important; 
            padding: 24px; 
            border-radius: 14px; 
            box-shadow: 0 3px 14px #0002; 
        }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        h1 { margin: 0; color: #1565c0 !important; font-size: 1.45rem; }
        .theme-toggle-group { display: flex; gap: 5px; }
        .theme-btn { background: #eceff1; color: #263238; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
        .theme-btn.active { background: #1565c0; color: white; }
        .notice { padding: 12px; background: #e3f2fd !important; color: #0d47a1 !important; border-radius: 8px; margin-bottom: 18px; }
        .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button { border: 0; border-radius: 8px; padding: 13px 10px; font-size: 1rem; cursor: pointer; -webkit-appearance: none; }
        .time { background: #e8f5e9 !important; color: #1b5e20 !important; }
        .time.selected { background: #2e7d32 !important; color: white !important; }

        /* 한 줄 1:1 동일 크기 버튼 그리드 레이아웃 */
        .action-btn-group { display: flex; gap: 10px; margin-top: 18px; width: 100%; }
        .action-btn-group form { flex: 1; margin: 0; }
        .action-btn-group button { 
            width: 100%; 
            height: 48px; 
            margin: 0 !important;
            box-sizing: border-box;
        }
        .primary { background: #1565c0 !important; color: white !important; }
        .secondary { background: #eceff1 !important; color: #263238 !important; flex: 1; }

        #message, #status { margin-top: 18px; padding: 14px; border-radius: 8px; white-space: pre-line; }
        #message { background: #fff8e1 !important; color: #7f6000 !important; }
        #status { background: #f5f5f5 !important; color: #263238 !important; line-height: 1.7; }
        .hidden { display: none; }
        .approved { color: #2e7d32 !important; font-weight: bold; }
        .rejected { color: #c62828 !important; font-weight: bold; }
        .pending { color: #ef6c00 !important; font-weight: bold; }
        .cancelled { color: #78909c !important; }

        /* 각 항목 한 줄 깔끔 정렬 인터넷 시간 상태 정보 카드 */
        #internetState { 
            margin-top: 14px; 
            padding: 14px 16px; 
            border-radius: 10px; 
            background: #eef5f9 !important; 
            color: #1565c0 !important; 
            border: 1px solid #bbdefb;
        }
        .state-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 0.95rem; 
            padding: 4px 0;
            white-space: nowrap;
        }
        .state-label { font-weight: bold; color: #37474f; }
        .state-value { font-weight: bold; }
        .remaining-highlight { color: #d32f2f !important; font-size: 1.1rem; }

        /* 신청 이력 테이블 스타일 */
        .history-section { margin-top: 22px; border-top: 1px solid #e0e0e0; padding-top: 16px; }
        .history-title { font-size: 1.05rem; font-weight: bold; color: #37474f; margin-bottom: 10px; }
        .history-list { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .history-list th, .history-list td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eceff1; }
        .history-list th { background: #f5f5f5; color: #546e7a; font-weight: 600; }
        .cancel-btn { background: #e53935 !important; color: white !important; padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; border: 0; cursor: pointer; }
        .cancel-btn:disabled { background: #b0bec5 !important; cursor: not-allowed; }

        /* 다크모드 스타일 */
        body.dark-mode { background: #121212 !important; color: #e0e0e0 !important; color-scheme: dark; }
        body.dark-mode main { background: #1e1e1e !important; box-shadow: 0 3px 14px rgba(0, 0, 0, 0.6); }
        body.dark-mode h1 { color: #90caf9 !important; }
        body.dark-mode .theme-btn { background: #2c3e50; color: #ecf0f1; }
        body.dark-mode .theme-btn.active { background: #90caf9; color: #121212; }
        body.dark-mode .notice { background: #0d3c61 !important; color: #e3f2fd !important; }
        body.dark-mode .time { background: #1b382b !important; color: #a3e4d7 !important; }
        body.dark-mode .time.selected { background: #2e7d32 !important; color: #ffffff !important; }
        body.dark-mode .primary { background: #1565c0 !important; color: #ffffff !important; }
        body.dark-mode .secondary { background: #2c3e50 !important; color: #ecf0f1 !important; }
        body.dark-mode #message { background: #4a3b10 !important; color: #ffe082 !important; }
        body.dark-mode #status { background: #262626 !important; color: #e0e0e0 !important; }
        body.dark-mode #internetState { background: #1b2a32 !important; color: #90caf9 !important; border-color: #264b5d; }
        body.dark-mode .state-label { color: #cfd8dc; }
        body.dark-mode .history-title { color: #cfd8dc; }
        body.dark-mode .history-list th { background: #263238; color: #b0bec5; }
        body.dark-mode .history-list td { border-bottom: 1px solid #37474f; }
    </style>
</head>
<body>
<main>
    <div class="header-container">
        <h1>인터넷 사용 신청</h1>
        <div class="theme-toggle-group">
            <button type="button" class="theme-btn active" id="lightModeBtn" onclick="setTheme('light')">일반모드</button>
            <button type="button" class="theme-btn" id="darkModeBtn" onclick="setTheme('dark')">다크모드</button>
        </div>
    </div>
    <div class="notice">인터넷 사용 시간을 선택한 후 사용요청을 눌러주세요.</div>
    <div class="options" id="timeOptions">
        {% for fare in internet_fares %}
        <button class="time configured-fare" data-min="{{ fare.minutes }}" data-price="{{ fare.price }}">{{ fare.minutes }}분 · {{ '%g'|format(fare.price) }} PHP</button>
        {% endfor %}
    </div>

    <!-- 동일 크기 한 줄 버튼 그룹 -->
    <div class="action-btn-group">
        <form id="requestForm" action="/request?min=30" method="get">
            <button class="primary" id="requestButton" type="submit">사용요청</button>
        </form>
        <button class="secondary" id="statusButton" type="button">상태확인</button>
    </div>

    <div id="message" class="hidden"></div>
    <div id="status" class="hidden"></div>

    <!-- 각각 한 줄씩 표시되는 인터넷 사용 시간 카드 -->
    <div id="internetState" class="hidden">
        <div class="state-row">
            <span class="state-label">시작시간</span>
            <span class="state-value" id="startTimeVal">-</span>
        </div>
        <div class="state-row">
            <span class="state-label">종료시간</span>
            <span class="state-value" id="endTimeVal">-</span>
        </div>
        <div class="state-row" style="margin-top: 4px;">
            <span class="state-label">남은시간</span>
            <span class="state-value remaining-highlight" id="remainingTimeVal">00:00:00</span>
        </div>
    </div>

    <!-- 신청 및 사용 이력 -->
    <div class="history-section">
        <div class="history-title">신청 및 사용 이력</div>
        <table class="history-list">
            <thead>
                <tr>
                    <th>신청시간</th>
                    <th>이용상품</th>
                    <th>상태</th>
                    <th>작업</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr>
                    <td colspan="4" style="text-align:center; color:#90a4ae;">이력을 불러오는 중...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    function setTheme(mode) {
        const lightBtn = document.getElementById('lightModeBtn');
        const darkBtn = document.getElementById('darkModeBtn');
        if (mode === 'dark') {
            document.body.classList.add('dark-mode');
            darkBtn.classList.add('active');
            lightBtn.classList.remove('active');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark-mode');
            lightBtn.classList.add('active');
            darkBtn.classList.remove('active');
            localStorage.setItem('theme', 'light');
        }
    }
    (function() {
        if (localStorage.getItem('theme') === 'dark') setTheme('dark');
        else setTheme('light');
    })();

    let selectedMinutes = 30;
    let expiresTimestamp = null;
    let timer1sInterval = null;
    let timer1mInterval = null;

    const messageBox = document.getElementById('message');
    const historyTableBody = document.getElementById('historyTableBody');
    const internetStateBox = document.getElementById('internetState');
    const startTimeVal = document.getElementById('startTimeVal');
    const endTimeVal = document.getElementById('endTimeVal');
    const remainingTimeVal = document.getElementById('remainingTimeVal');

    function requestJson(url, options) {
        options = options || {};
        return fetch(url, options).then(res => res.json());
    }

    document.querySelectorAll('.time').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelectorAll('.time').forEach(item => item.classList.remove('selected'));
            button.classList.add('selected');
            selectedMinutes = Number(button.dataset.min);
        });
    });
    if (document.querySelector('.time')) {
        document.querySelector('.time').classList.add('selected');
    }

    function showMessage(text) {
        messageBox.textContent = text;
        messageBox.classList.remove('hidden');
    }

    // 초를 HH:MM:SS 포맷으로 변환
    function formatTime(totalSeconds) {
        if (totalSeconds <= 0) return "00:00:00";
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
    }

    // 1초마다 남은 시간 갱신
    function update1sTimer() {
        if (!expiresTimestamp) return;
        const now = Math.floor(Date.now() / 1000);
        const diff = expiresTimestamp - now;
        
        if (diff <= 0) {
            remainingTimeVal.textContent = "00:00:00 (만료됨)";
            expiresTimestamp = null;
            checkStatus();
            return;
        }
        remainingTimeVal.textContent = formatTime(diff);
    }

    // 활성 인터넷 사용 정보 카드 업데이트
    function updateActiveSessionDisplay(activeSession) {
        if (!activeSession) {
            internetStateBox.classList.add('hidden');
            expiresTimestamp = null;
            return;
        }

        const startStr = activeSession.start_time || activeSession.request_time || '-';
        const expireStr = activeSession.expires_at || '-';
        
        startTimeVal.textContent = startStr;
        endTimeVal.textContent = expireStr;
        
        if (expireStr !== '-') {
            expiresTimestamp = Math.floor(new Date(expireStr.replace(/-/g, '/')).getTime() / 1000);
        } else {
            expiresTimestamp = null;
        }

        internetStateBox.classList.remove('hidden');
        update1sTimer();
    }

    // 상태 뱃지 HTML 생성
    function getStatusBadge(status) {
        if (status === 'Approved' || status === 'ACTIVE') return '<span class="approved">승인됨</span>';
        if (status === 'Pending' || status === 'PENDING') return '<span class="pending">대기 중</span>';
        if (status === 'Rejected' || status === 'REJECTED') return '<span class="rejected">거절됨</span>';
        if (status === 'Cancelled' || status === 'CANCELLED') return '<span class="cancelled">취소됨</span>';
        if (status === 'Expired' || status === 'EXPIRED') return '<span class="cancelled">만료됨</span>';
        return `<span>${status}</span>`;
    }

    // 이력 렌더링
    function renderHistoryList(history) {
        if (!history || history.length === 0) {
            historyTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#90a4ae;">신청 내역이 없습니다.</td></tr>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const reqTime = (item.request_time || '').slice(11, 16);
            const isPending = item.status === 'Pending' || item.status === 'PENDING' || item.overall_status === 'PENDING';
            const actionBtn = isPending 
                ? `<button class="cancel-btn" onclick="cancelUserRequest('${item.request_id || item.id}')">취소</button>` 
                : '-';

            html += `<tr>
                <td>${reqTime || '-'}</td>
                <td>${item.minutes}분 (${item.price} PHP)</td>
                <td>${getStatusBadge(item.status || item.overall_status)}</td>
                <td>${actionBtn}</td>
            </tr>`;
        });
        historyTableBody.innerHTML = html;
    }

    // 취소 요청
    async function cancelUserRequest(requestId) {
        if (!confirm('신청한 요청을 취소하시겠습니까?')) return;
        try {
            const res = await requestJson(`/cancel-request?id=${requestId}`, { method: 'POST' });
            showMessage(res.msg || '요청이 취소되었습니다.');
            checkStatus();
        } catch (e) {
            showMessage('취소 처리 중 오류가 발생했습니다.');
        }
    }

    // 상태 동기화 (1분 간격)
    async function checkStatus() {
        try {
            const data = await requestJson('/status');
            if (data.history) {
                renderHistoryList(data.history);
                const active = data.history.find(r => (r.overall_status || r.status) === 'ACTIVE' || (r.overall_status || r.status) === 'Approved');
                updateActiveSessionDisplay(active);
            } else {
                updateActiveSessionDisplay(null);
            }
        } catch (e) {}
    }

    // 사용요청 Form 전송
    const requestButton = document.getElementById('requestButton');
    let requestCooldown = false;
    document.getElementById('requestForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (requestCooldown) return;
        requestCooldown = true;
        requestButton.disabled = true;
        requestButton.textContent = '요청 처리 중...';

        try {
            const data = await requestJson(`/request?min=${selectedMinutes}`, { method: 'GET' });
            showMessage(data.msg || '요청이 처리되었습니다.');
            checkStatus();
        } finally {
            setTimeout(() => {
                requestCooldown = false;
                requestButton.disabled = false;
                requestButton.textContent = '사용요청';
            }, 300);
        }
    });

    document.getElementById('statusButton').addEventListener('click', checkStatus);

    // 초기 상태 불러오기 및 타이머 구동
    checkStatus();
    timer1sInterval = setInterval(update1sTimer, 1000);  // 1초마다 남은 시간 갱신
    timer1mInterval = setInterval(checkStatus, 60000);   // 1분마다 서버 데이터 동기화
</script>
</body>
</html>
