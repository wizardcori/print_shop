<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkBox - File Transfer ({{ zone }})</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; box-sizing: border-box; }
        input[type="text"], input[type="file"] { margin: 10px 0; width: 90%; padding: 10px; font-size: 14px; box-sizing: border-box; }
        
        /* Button Group Styles */
        .button-group { display: flex; justify-content: space-between; width: 90%; margin: 10px auto 0 auto; }
        .btn { background-color: #007BFF; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; width: 48%; }
        .btn:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; width: 48%; }
        .btn-danger:hover { background-color: #c82333; }
        
        .badge { background-color: #e9ecef; color: #495057; padding: 5px 10px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .info { font-size: 13px; color: #666; margin-bottom: 15px; }
        
        /* Transfer Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; }
        
        /* Status Row Colors */
        .status-untransferred { background-color: #f1f3f5; color: #495057; }
        .status-transferring { background-color: #e7f5ff; color: #1971c2; font-weight: bold; }
        .status-completed { background-color: #d4edda; color: #155724; font-weight: bold; }
    </style>
    <script>
        let selectedFilesArray = [];

        function detectDevice() {
            let ua = navigator.userAgent;
            let deviceStr = "GalaxyS23";
            if (/android/i.test(ua)) {
                let match = ua.match(/(SM-[A-Za-z0-9]+)/);
                if (match) deviceStr = match[1];
                else deviceStr = "GalaxyS23";
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                deviceStr = "iPhone";
            } else if (/windows/i.test(ua)) {
                deviceStr = "PC-Windows";
            } else if (/mac/i.test(ua)) {
                deviceStr = "PC-Mac";
            }
            document.cookie = "device_info=" + deviceStr + "; path=/; max-age=86400";
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function handleFileSelection(event) {
            const files = event.target.files;
            let duplicateCount = 0;

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                let isDuplicate = selectedFilesArray.some(existingFile => 
                    existingFile.name === file.name && existingFile.size === file.size
                );

                if (!isDuplicate) {
                    selectedFilesArray.push(file);
                } else {
                    duplicateCount++;
                }
            }

            if (duplicateCount > 0) {
                alert(`${duplicateCount} duplicate file(s) were excluded.`);
            }

            event.target.value = '';
            updateTableUI();
        }

        function updateTableUI() {
            const tbody = document.getElementById('transfer-tbody');
            tbody.innerHTML = '';

            selectedFilesArray.forEach((file, index) => {
                let row = document.createElement('tr');
                row.className = file.isCompleted ? 'status-completed' : 'status-untransferred';
                row.id = 'file-row-' + index;
                
                let statusText = file.isCompleted ? 'Completed (100%)' : 'Pending (0%)';
                let timeText = file.uploadTime || '-';

                row.innerHTML = `
                    <td><input type="checkbox" class="file-checkbox" data-index="${index}"></td>
                    <td>${index + 1}</td>
                    <td>${file.name}</td>
                    <td>${formatBytes(file.size)}</td>
                    <td>${timeText}</td>
                    <td>${statusText}</td>
                `;
                tbody.appendChild(row);
            });

            const selectAllCheckbox = document.getElementById('select-all');
            if (selectAllCheckbox) selectAllCheckbox.checked = false;
        }

        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        function deleteSelectedFiles() {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Please select files to delete.");
                return;
            }

            if (!confirm(`Are you sure you want to delete ${checkboxes.length} selected file(s)?`)) {
                return;
            }

            const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index'))).sort((a, b) => b - a);
            
            let filesToDeleteFromServer = [];
            indicesToDelete.forEach(index => {
                let row = document.getElementById('file-row-' + index);
                if (selectedFilesArray[index]) {
                    if (selectedFilesArray[index].isCompleted) {
                        filesToDeleteFromServer.push(selectedFilesArray[index].name);
                    }
                    selectedFilesArray.splice(index, 1);
                }
            });

            if (filesToDeleteFromServer.length > 0) {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/delete?zone={zone}', true);
                xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        updateTableUI();
                        alert("Selected files have been deleted from the list and server.");
                    } else {
                        alert("Failed to delete files from server.");
                    }
                };
                xhr.send(JSON.stringify({ files: filesToDeleteFromServer }));
            } else {
                updateTableUI();
                alert("Selected files have been deleted from the list.");
            }
        }

        function uploadFiles(event) {
            event.preventDefault();
            
            let filesToUpload = selectedFilesArray.filter(file => !file.isCompleted);

            if (filesToUpload.length === 0) {
                alert("No new files to send. Please select new files.");
                return;
            }

            const formData = new FormData();
            
            const nameInput = document.getElementById('user-name-input');
            const userName = nameInput ? nameInput.value.trim() : "";
            formData.append('user_name', userName);

            filesToUpload.forEach(file => {
                formData.append('file', file);
            });

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload?zone={zone}&user_name=' + encodeURIComponent(userName), true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    let percent = Math.round((e.loaded / e.total) * 100);
                    selectedFilesArray.forEach((file, i) => {
                        if (!file.isCompleted) {
                            let row = document.getElementById('file-row-' + i);
                            if (row) {
                                row.className = 'status-transferring';
                                let timeNow = new Date().toLocaleTimeString();
                                row.cells[4].innerText = timeNow;
                                row.cells[5].innerText = `Transferring (${percent}%)`;
                            }
                        }
                    });
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 303) {
                    let timeNow = new Date().toLocaleTimeString();
                    selectedFilesArray.forEach((file, i) => {
                        if (!file.isCompleted) {
                            file.isCompleted = true;
                            file.uploadTime = timeNow;
                        }
                    });
                    updateTableUI();
                    alert("File transfer completed successfully.");
                } else {
                    alert("An error occurred during transfer.");
                }
            };

            xhr.send(formData);
        }

        window.onload = function() {
            detectDevice();
        };
    </script>
</head>
<body>
    <div class="box">
        <h2>📦 LinkBox File Transfer</h2>
        <div class="badge">📍 Location: {zone}</div>
        {content}
    </div>
</body>
</html>
